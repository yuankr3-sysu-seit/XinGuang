# YOLOv8n with CBAM attention and WIoU loss (WIoU enabled in source code)
# Model configuration for Xinguang defect detection

# Parameters
nc: 3  # number of classes (defect_2, defect_3, defect_6)
scales: # model compound scaling constants, 'n' scale used by default
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]  # YOLOv8n summary: 129 layers, 3157200 parameters, 3157184 gradients, 8.9 GFLOPs

# YOLOv8n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]          # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]         # 1-P2/4
  - [-1, 3, C2f, [128, True]]          # 2
  - [-1, 1, Conv, [256, 3, 2]]         # 3-P3/8
  - [-1, 6, C2f, [256, True]]          # 4
  - [-1, 1, Conv, [512, 3, 2]]         # 5-P4/16
  - [-1, 6, C2f, [512, True]]          # 6
  - [-1, 1, Conv, [1024, 3, 2]]        # 7-P5/32
  - [-1, 3, C2f, [1024, True]]         # 8
  - [-1, 1, SPPF, [1024, 5]]           # 9

# YOLOv8n head with CBAM inserted before final feature fusion
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 6], 1, Concat, [1]]                    # 11 cat backbone P4
  - [-1, 3, C2f, [512]]                          # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 4], 1, Concat, [1]]                    # 14 cat backbone P3
  - [-1, 3, C2f, [256]]                          # 15 (P3/8-small)

  # ========== CBAM Attention Module ==========
  - [-1, 1, CBAM, [256]]                         # 16 增强P3特征，聚焦小瑕疵

  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 12], 1, Concat, [1]]                   # 18 cat head P4
  - [-1, 3, C2f, [512]]                          # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 9], 1, Concat, [1]]                    # 21 cat head P5
  - [-1, 3, C2f, [1024]]                         # 22 (P5/32-large)

  - [[15, 19, 22], 1, Detect, [nc]]              # 23 Detect(P3, P4, P5)
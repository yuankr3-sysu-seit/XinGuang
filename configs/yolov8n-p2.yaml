# Ultralytics YOLOv8n with P2 detection head
# 纯净版，无任何注意力模块，仅增加P2层用于小目标检测

nc: 3  # 你的类别数
scales:
  n: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]  # 2-P2 特征提取
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]  # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]  # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]]   # 9

head:
  # FPN 上采样路径
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 10
  - [[-1, 6], 1, Concat, [1]]  # 11 cat P4
  - [-1, 3, C2f, [512]]        # 12

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 13
  - [[-1, 4], 1, Concat, [1]]  # 14 cat P3
  - [-1, 3, C2f, [256]]        # 15

  # 🎯 新增 P2 上采样与融合
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']] # 16
  - [[-1, 2], 1, Concat, [1]]  # 17 cat P2
  - [-1, 3, C2f, [128]]        # 18 (P2 检测头输入)

  # PAN 下采样路径
  - [18, 1, Conv, [256, 3, 2]] # 19
  - [[-1, 15], 1, Concat, [1]] # 20 cat P3
  - [-1, 3, C2f, [256]]        # 21 (P3 检测头输入)

  - [21, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 12], 1, Concat, [1]] # 23 cat P4
  - [-1, 3, C2f, [512]]        # 24 (P4 检测头输入)

  - [24, 1, Conv, [1024, 3, 2]] # 25
  - [[-1, 9], 1, Concat, [1]]   # 26 cat P5
  - [-1, 3, C2f, [1024]]        # 27 (P5 检测头输入)

  # 🎯 四头检测 (P2, P3, P4, P5)
  - [[18, 21, 24, 27], 1, Detect, [nc]]